<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#062A1E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>UMESH SMARTBILL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230FA36C'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>U₹</text></svg>" />
  <style>
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#F3F7F5;font-family:Inter,system-ui,sans-serif;color:#0C2A20}
    #boot .b{text-align:center}
    #boot .l{width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,#0B9368,#13B79B);color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center;margin:0 auto 12px}
    #boot small{color:#6B8378}
    #err{display:none;position:fixed;inset:16px;padding:16px;background:#FBEBEA;border:1px solid #D9534F;border-radius:12px;color:#7d231f;font:12px ui-monospace,monospace;white-space:pre-wrap;z-index:999}
  </style>
</head>
<body>
  <div id="boot"><div class="b"><div class="l">U₹</div><b>UMESH SMARTBILL</b><br><small>Loading… thoda intezar karein</small></div></div>
  <div id="root"></div>
  <div id="err"></div>
  <script>
    window.addEventListener('error', function (e) {
      var d = document.getElementById('err');
      d.style.display = 'block';
      d.textContent = '⚠ App load error:\n' + (e.message || e.error) + '\n' + (e.filename || '') + ':' + (e.lineno || '');
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
